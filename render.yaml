# Render Blueprint — AlphaAttest keeper
# Free web service (not a worker): Render's free tier requires an HTTP port,
# so the keeper exposes /healthz and a scheduled GitHub Actions ping keeps it
# from spinning down (free services sleep after 15 idle minutes). Render
# restarts crashed services automatically; the keeper's startup scan recovers
# any pending resolutions from the chain, so restarts are lossless.
services:
  - type: web
    name: alphaattest-keeper
    runtime: docker
    repo: https://github.com/dmustapha/alpha-attest
    branch: main
    rootDir: keeper
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FINNHUB_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: KEEPER_PRIVATE_KEY
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
      - key: SIGNAL_REGISTRY_ADDRESS
        value: "0x23CD0368f1471de25E4F90f1bb2217E4Fc17bC56"
